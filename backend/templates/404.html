{% extends "base.html" %}
{% block title %}404 — Page not found{% endblock %}

{% block content %}
<section class="csp-error-page">
  <div class="container text-center">
    <div class="csp-error-code csp-mono csp-gradient-text">404</div>
    <h1 class="csp-dashboard-title">This page drifted into the clouds.</h1>
    <p class="csp-muted mx-auto" style="max-width: 480px;">
      The URL you tried doesn't exist here — but everything else is still online.
    </p>
    <div class="d-flex justify-content-center gap-2 mt-4">
      <a href="{{ url_for('main.home') }}" class="btn csp-btn-primary" data-testid="err-home"><i class="fa-solid fa-house me-1"></i> Back home</a>
      <a href="{{ url_for('dashboard.dashboard') }}" class="btn csp-btn-ghost" data-testid="err-dashboard"><i class="fa-solid fa-gauge-high me-1"></i> Dashboard</a>
    </div>
  </div>
</section>
{% endblock %}
